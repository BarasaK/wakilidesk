name: Deploy wakiliDesk staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: wakilidesk-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/wakilidesk_deploy_key
          chmod 600 ~/.ssh/wakilidesk_deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/wakilidesk_deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'REMOTE'
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="master"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing Git checkout at $APP_DIR."
              echo "Create it once on the VPS, copy .env.prod, then rerun this workflow."
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            chmod +x scripts/deploy.sh
            APP_DIR="$APP_DIR" scripts/deploy.sh
          REMOTE
