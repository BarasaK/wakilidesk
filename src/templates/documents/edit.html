{% extends "app_base.html" %}

{% block title %}Edit document | wakiliDesk{% endblock %}

{% block app_content %}
  <header class="page-header">
    <div>
      <h2>Edit Document Metadata</h2>
      <p class="lede">{{ document.title }}</p>
    </div>
  </header>

  <section class="panel">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form %}
          <div class="field {% if field.name == 'description' %}full-width{% endif %}">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}
      </div>
      <button class="button" type="submit">Save metadata</button>
    </form>
  </section>
{% endblock %}
