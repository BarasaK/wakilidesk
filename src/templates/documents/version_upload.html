{% extends "app_base.html" %}

{% block title %}New version | wakiliDesk{% endblock %}

{% block app_content %}
  <header class="page-header">
    <div>
      <h2>Upload New Version</h2>
      <p class="lede">{{ document.title }}</p>
    </div>
  </header>

  <section class="panel">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button class="button" type="submit">Upload version</button>
    </form>
  </section>
{% endblock %}
