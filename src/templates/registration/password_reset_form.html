{% extends "base.html" %}

{% block title %}Reset password | wakiliDesk{% endblock %}

{% block content %}
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="reset-title">
      <h1 id="reset-title" class="brand">Reset Password</h1>
      <p class="lede">Enter your account email and we will send a reset link.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="field">
          <label for="{{ form.email.id_for_label }}">Email address</label>
          {{ form.email }}
          {{ form.email.errors }}
        </div>
        <button class="button" type="submit">Send reset link</button>
      </form>

      <p class="help-row"><a href="{% url 'login' %}">Back to sign in</a></p>
    </section>
  </main>
{% endblock %}
