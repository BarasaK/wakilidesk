<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wakiliDesk{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee4;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--accent-dark);
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-panel {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 16px 45px rgba(16, 24, 40, 0.08);
    }

    .brand {
      margin: 0 0 4px;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .lede {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }

    input:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: var(--accent);
    }

    .button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .button:hover,
    .button:focus {
      background: var(--accent-dark);
    }

    .errorlist,
    .form-error {
      margin: 0 0 16px;
      color: var(--danger);
      font-size: 0.9rem;
    }

    .help-row {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .sidebar {
      background: #16202a;
      color: #fff;
      padding: 24px 18px;
    }

    .sidebar a {
      display: block;
      color: #d9f2ef;
      text-decoration: none;
      padding: 9px 0;
      font-weight: 700;
    }

    .sidebar form {
      margin: 0;
    }

    .sidebar button.link-button {
      display: block;
      width: 100%;
      border: 0;
      padding: 9px 0;
      background: transparent;
      color: #d9f2ef;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: left;
    }

    .main {
      padding: 28px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    .table th,
    .table td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .button.secondary {
      display: inline-flex;
      width: auto;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      background: #344054;
      text-decoration: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .messages {
      margin-bottom: 18px;
    }

    .message {
      padding: 10px 12px;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      background: #ecfdf3;
    }

    @media (max-width: 760px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        padding: 16px 18px;
      }

      .main {
        padding: 18px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
