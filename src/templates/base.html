<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wakiliDesk{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee4;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--accent-dark);
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-panel {
      width: min(100%, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 16px 45px rgba(16, 24, 40, 0.08);
    }

    .brand {
      margin: 0 0 4px;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .lede {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      min-height: 0;
      margin-right: 8px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: var(--accent);
    }

    .field ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .field li label {
      display: flex;
      align-items: center;
      margin: 0;
      font-weight: 400;
    }

    .button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .button:hover,
    .button:focus {
      background: var(--accent-dark);
    }

    .errorlist,
    .form-error {
      margin: 0 0 16px;
      color: var(--danger);
      font-size: 0.9rem;
    }

    .help-row {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      transform: translateY(-140%);
      border-radius: 6px;
      padding: 9px 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .sidebar {
      background: #16202a;
      color: #fff;
      padding: 24px 18px;
    }

    .sidebar a {
      display: block;
      color: #d9f2ef;
      text-decoration: none;
      padding: 9px 0;
      font-weight: 700;
    }

    .sidebar-branding .lede {
      color: #bdd7d4;
    }

    .sidebar form {
      margin: 0;
    }

    .sidebar button.link-button {
      display: block;
      width: 100%;
      border: 0;
      padding: 9px 0;
      background: transparent;
      color: #d9f2ef;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-align: left;
    }

    .main {
      padding: 28px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .panel:has(.table) {
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    .table th,
    .table td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .button.secondary {
      display: inline-flex;
      width: auto;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      background: #344054;
      text-decoration: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .logo-preview {
      margin-bottom: 10px;
    }

    .logo-preview img {
      display: block;
      width: auto;
      max-width: 220px;
      max-height: 90px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fff;
      object-fit: contain;
    }

    .messages {
      margin-bottom: 18px;
    }

    .message {
      padding: 10px 12px;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      background: #ecfdf3;
    }

    .dashboard-band {
      margin-bottom: 18px;
    }

    .section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .section-heading h3 {
      margin: 0 0 4px;
    }

    .section-heading.compact {
      align-items: center;
      margin-bottom: 12px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card {
      display: flex;
      min-height: 112px;
      gap: 14px;
      align-items: flex-start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.05);
    }

    .metric-card.urgent {
      border-color: #fecdca;
      background: #fffafa;
    }

    .metric-icon,
    .quick-icon {
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 8px;
      background: #ccfbf1;
      color: #0f766e;
    }

    .metric-icon {
      width: 42px;
      height: 42px;
    }

    .metric-icon svg,
    .quick-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .metric-icon.blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .metric-icon.amber {
      background: #fef3c7;
      color: #b45309;
    }

    .metric-icon.red {
      background: #fee4e2;
      color: #b42318;
    }

    .metric-icon.violet {
      background: #ede9fe;
      color: #6d28d9;
    }

    .metric-icon.green {
      background: #dcfce7;
      color: #15803d;
    }

    .metric-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .metric-value {
      display: block;
      font-size: 2rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
      gap: 18px;
      align-items: start;
    }

    .progress-percent {
      color: var(--accent-dark);
      font-size: 1.35rem;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
      margin-bottom: 14px;
    }

    .progress-track span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .text-link {
      display: inline-flex;
      font-weight: 700;
      text-decoration: none;
    }

    .quick-actions h3 {
      margin-top: 0;
    }

    .quick-action-grid {
      display: grid;
      gap: 10px;
    }

    .quick-action-grid a {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
      background: #fff;
    }

    .quick-action-grid a:hover,
    .quick-action-grid a:focus {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .quick-icon {
      width: 32px;
      height: 32px;
    }

    .calendar-panel {
      overflow-x: auto;
    }

    .calendar-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .calendar-weekdays,
    .calendar-grid {
      min-width: 860px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekdays {
      border: 1px solid var(--line);
      border-bottom: 0;
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
    }

    .calendar-weekdays div {
      padding: 10px;
      border-right: 1px solid var(--line);
    }

    .calendar-day {
      min-height: 142px;
      border: 1px solid var(--line);
      border-right: 0;
      border-bottom: 0;
      padding: 8px;
      background: #fff;
    }

    .calendar-day:nth-child(7n) {
      border-right: 1px solid var(--line);
    }

    .calendar-day:nth-last-child(-n + 7) {
      border-bottom: 1px solid var(--line);
    }

    .calendar-day.muted {
      background: #f8fafc;
      color: #98a2b3;
    }

    .calendar-day.today {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .calendar-day-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .calendar-day-head strong {
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 999px;
    }

    .calendar-day.today .calendar-day-head strong {
      background: var(--accent);
      color: #fff;
    }

    .calendar-day-head a {
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }

    .calendar-events {
      display: grid;
      gap: 6px;
    }

    .calendar-event {
      display: block;
      overflow: hidden;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 6px 7px;
      background: #ecfdf3;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.25;
      text-decoration: none;
      text-overflow: ellipsis;
    }

    .calendar-event span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .calendar-event.event-hearing,
    .calendar-event.event-mention {
      border-left-color: var(--accent);
      background: #ecfdf3;
    }

    .calendar-event.event-filing_deadline {
      border-left-color: #b42318;
      background: #fff1f3;
    }

    .calendar-event.event-client_meeting {
      border-left-color: #1d4ed8;
      background: #eff6ff;
    }

    .calendar-event.event-internal_task {
      border-left-color: #667085;
      background: #f2f4f7;
    }

    .calendar-event.status-cancelled,
    .calendar-event.status-adjourned {
      opacity: 0.62;
      text-decoration: line-through;
    }

    .calendar-empty {
      color: #98a2b3;
      font-size: 0.78rem;
    }

    @media (max-width: 760px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        padding: 12px 14px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.14);
      }

      .sidebar-branding {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .sidebar .brand {
        flex: 0 0 auto;
        margin: 0;
        font-size: 1.2rem;
      }

      .sidebar .lede {
        overflow: hidden;
        margin: 0;
        color: #bdd7d4;
        font-size: 0.82rem;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: thin;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
      }

      .sidebar a,
      .sidebar button.link-button {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        min-height: 38px;
        border: 1px solid rgba(217, 242, 239, 0.2);
        border-radius: 6px;
        padding: 8px 11px;
        background: rgba(255, 255, 255, 0.06);
        line-height: 1;
        scroll-snap-align: start;
        white-space: nowrap;
      }

      .sidebar a:hover,
      .sidebar a:focus,
      .sidebar button.link-button:hover,
      .sidebar button.link-button:focus {
        background: rgba(255, 255, 255, 0.12);
        outline: 2px solid rgba(217, 242, 239, 0.28);
        outline-offset: 2px;
      }

      .sidebar form {
        flex: 0 0 auto;
      }

      .main {
        padding: 18px 14px;
      }

      .panel {
        padding: 16px;
      }

      .table {
        min-width: 620px;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .section-heading {
        flex-direction: column;
      }

      .metric-grid,
      .dashboard-layout {
        grid-template-columns: 1fr;
      }

      .calendar-toolbar {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
