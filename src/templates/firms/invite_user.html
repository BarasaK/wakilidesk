{% extends "app_base.html" %}

{% block title %}Invite user | wakiliDesk{% endblock %}

{% block app_content %}
  <header class="page-header">
    <div>
      <h2>Invite User</h2>
      <p class="lede">Create a firm-scoped invitation.</p>
    </div>
  </header>

  <section class="panel">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button class="button" type="submit">Create invitation</button>
    </form>
  </section>
{% endblock %}
